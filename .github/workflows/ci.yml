name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Tests d'installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: tests/smoke.sh

  reproducible:
    name: dist/ correspond à GSTACK_REF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: ./build.sh
      - name: Aucun écart entre dist/ et la régénération
        run: |
          changes="$(git status --porcelain -- dist)"
          [ -z "$changes" ] && exit 0
          # Une annotation par fichier en écart, lisible sans ouvrir les logs.
          printf '%s\n' "$changes" | head -20 | while IFS= read -r line; do echo "::error::dist diffère : $line"; done
          git diff --stat -- dist | tail -1 | sed 's/^/::error::/'
          git diff -- dist | head -40 | grep '^[+-]' | grep -v '^+++\|^---' | head -6 | sed 's/^/::error::extrait /'
          exit 1
